{% extends "base.html" %}

{% block title %}Sign in — Server monitoring{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <p class="lede">One shared admin account for this local demo.</p>
  <form method="post" action="{{ url_for('sign_in') }}" onsubmit="return false;">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <p class="error" role="alert" hidden>Sign-in failed.</p>

    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
