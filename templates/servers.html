{% extends "base.html" %}

{% block title %}Servers — Server monitoring{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-head">
    <h1>Servers</h1>
    <a class="text-link" href="{{ url_for('sign_in') }}">Sign out</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Hostname or IP</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ server.name }}</td>
        <td>{{ server.hostname }}</td>
        <td class="row-actions">
          <button type="button">Remove</button>
          <a href="{{ url_for('metrics') }}">Metrics</a>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="note">Placeholder row. Servers are not saved yet.</p>

  <h2>Add server</h2>
  <form class="add-form" method="post" action="{{ url_for('servers') }}" onsubmit="return false;">
    <div>
      <label for="display-name">Display name</label>
      <input id="display-name" name="display_name" type="text" required>
    </div>
    <div>
      <label for="hostname">Hostname or IP</label>
      <input id="hostname" name="hostname" type="text" required>
    </div>
    <button type="submit">Add</button>
  </form>
</section>
{% endblock %}
